<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>stars by the pocketful | midnight rain</title>

 <body>
  <class="zodiac-page">
    <div
  id="zodiac-starfield"
  class="zodiac-starfield"
  aria-hidden="true"
  ></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="#" aria-label="Midnight Rain home">
          midnight rain<span class="wordmark-sparkle" aria-hidden="true"></span>
        </a>
        <span class="eyebrow" id="sky-status">
          HALF MOONSHINE, A FULL ECLIPSE
        </span>
    </header>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>

  <main class="zodiac-container">

    <a href="./index.html" class="zodiac-back">
      ← ☾
    </a>

    <header class="zodiac-header">
      <span class="zodiac-eyebrow">
        A LITTLE CELESTIAL MAGIC
      </span>

      <h1 class="zodiac-title">
  <span class="title-star" aria-hidden="true">✧</span>
  <span>stars by the pocketful</span>
  <span class="title-star" aria-hidden="true">✧</span>
</h1>

      <p>
        A little glimpse into the stars above us.
      </p>
    </header>

    <section class="constellation-section">

      <div class="constellation-display">

  <!-- Small decorative stars in the background -->
  <div class="constellation-background-stars" aria-hidden="true">
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
  </div>

  <!-- Current zodiac constellation -->
  <div
    id="constellation-art"
    class="constellation-art"
    role="img"
    aria-label="Current zodiac constellation"
  ></div>

</div>

      <span class="zodiac-label">
        THE CURRENT ZODIAC SEASON
      </span>

      <h2 id="sun-sign">Loading...</h2>

      <p id="sun-description"></p>

    </section>

    <section class="moon-zodiac-section">

      <span class="zodiac-divider">✦</span>

      <span class="zodiac-label">
        WHERE TONIGHT'S MOON LIES...
      </span>

      <div
  id="moon-constellation"
  class="moon-constellation"
  role="img"
  aria-label="Current Moon zodiac constellation"
></div>

      <h2 id="moon-sign">Loading...</h2>

      <p id="moon-description"></p>

    </section>

    <p class="zodiac-footer">
      A little reminder that we all share the same sky.
    </p>

  </main>

  <script type="module" src="./src/zodiac.js"></script>

</body>
</html>
